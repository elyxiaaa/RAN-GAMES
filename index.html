<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/images/main-logo.webp" />

    <!--
      Title, description, canonical, robots, Open Graph, Twitter and JSON-LD
      are injected at build time from src/data/seo.ts by plugins/vite-plugin-seo.ts.
      Do not hand-write them here; edit seo.ts instead.
    -->

    <link
      rel="preload"
      as="image"
      href="/images/background.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/character.webp"
      type="image/webp"
    />

    <!--
      The page is prerendered, so crawlers that do not run JavaScript receive
      the real markup. Motion writes its entry state as inline opacity:0, which
      would read as hidden text to those agents. This reveals it for them, and
      is inert the moment JavaScript hydrates.
    -->
    <noscript>
      <style>
        [style*="opacity:0"],
        [style*="opacity: 0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
